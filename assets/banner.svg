<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <style>
      @keyframes scan{0%{transform:translateY(0);opacity:0}5%{opacity:.06}95%{opacity:.06}100%{transform:translateY(265px);opacity:0}}
      @keyframes titlePulse{0%,100%{opacity:1}50%{opacity:.85}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes nodePulse{0%,100%{opacity:.5}50%{opacity:1}}
      .sc{animation:scan 5s linear infinite}
      .t{animation:titlePulse 4s ease-in-out infinite}
      .cu{animation:blink 1s step-end infinite}
      .nd{animation:nodePulse 2s ease-in-out infinite}
      .nd2{animation:nodePulse 2s ease-in-out infinite 1s}
    </style>
    <filter id="g1"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="g2"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0L0 0 0 35" fill="none" stroke="#00E5FF" stroke-width=".25" opacity=".12"/></pattern>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#0d1340"/><stop offset="100%" stop-color="#050816"/></radialGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/><stop offset="25%" stop-color="#00E5FF" stop-opacity=".9"/><stop offset="55%" stop-color="#8B5CF6"/><stop offset="80%" stop-color="#8B5CF6" stop-opacity=".3"/><stop offset="100%" stop-color="#050816" stop-opacity="0"/></linearGradient>
    <mask id="gm"><radialGradient id="mgr" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="white" stop-opacity="1"/><stop offset="75%" stop-color="white" stop-opacity=".4"/><stop offset="100%" stop-color="white" stop-opacity="0"/></radialGradient><rect width="900" height="260" fill="url(#mgr)"/></mask>
  </defs>
  <rect width="900" height="260" fill="#050816"/>
  <rect width="900" height="260" fill="url(#bg)"/>
  <rect width="900" height="260" fill="url(#grid)" mask="url(#gm)"/>
  <rect class="sc" x="0" y="-4" width="900" height="4" fill="#00E5FF"/>
  <line x1="65" y1="60" x2="65" y2="200" stroke="#00E5FF" stroke-width=".8" opacity=".2" stroke-dasharray="6,4"/>
  <line x1="65" y1="130" x2="145" y2="130" stroke="#00E5FF" stroke-width=".8" opacity=".2"/>
  <circle class="nd" cx="65" cy="75" r="5" fill="none" stroke="#00E5FF" stroke-width="1.5"/>
  <circle cx="65" cy="75" r="2" fill="#00E5FF" opacity=".7"/>
  <circle cx="65" cy="185" r="3" fill="#8B5CF6" opacity=".4"/>
  <circle cx="145" cy="130" r="2" fill="#00E5FF" opacity=".35"/>
  <line x1="835" y1="60" x2="835" y2="200" stroke="#FF2D95" stroke-width=".8" opacity=".2" stroke-dasharray="6,4"/>
  <line x1="835" y1="130" x2="755" y2="130" stroke="#FF2D95" stroke-width=".8" opacity=".2"/>
  <circle class="nd2" cx="835" cy="75" r="5" fill="none" stroke="#FF2D95" stroke-width="1.5"/>
  <circle cx="835" cy="75" r="2" fill="#FF2D95" opacity=".7"/>
  <circle cx="835" cy="185" r="3" fill="#8B5CF6" opacity=".4"/>
  <circle cx="755" cy="130" r="2" fill="#FF2D95" opacity=".35"/>
  <path d="M20 20L20 58M20 20L58 20" fill="none" stroke="#00E5FF" stroke-width="2" filter="url(#g1)"/>
  <circle cx="20" cy="20" r="2.5" fill="#00E5FF" filter="url(#g1)"/>
  <path d="M880 20L880 58M880 20L842 20" fill="none" stroke="#00E5FF" stroke-width="2" filter="url(#g1)"/>
  <circle cx="880" cy="20" r="2.5" fill="#00E5FF" filter="url(#g1)"/>
  <path d="M20 240L20 202M20 240L58 240" fill="none" stroke="#FF2D95" stroke-width="2" filter="url(#g1)"/>
  <circle cx="20" cy="240" r="2.5" fill="#FF2D95" filter="url(#g1)"/>
  <path d="M880 240L880 202M880 240L842 240" fill="none" stroke="#FF2D95" stroke-width="2" filter="url(#g1)"/>
  <circle cx="880" cy="240" r="2.5" fill="#FF2D95" filter="url(#g1)"/>
  <text x="450" y="70" font-family="'Courier New',Courier,monospace" font-size="10" fill="#00E5FF" text-anchor="middle" letter-spacing="8" opacity=".8">ONEFLOW OPERATING SYSTEM</text>
  <rect x="175" y="80" width="550" height=".8" fill="url(#lg)"/>
  <text class="t" x="450" y="148" font-family="'Courier New',Courier,monospace" font-size="50" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="4" filter="url(#g2)">PRATHAMESH SONAR</text>
  <rect x="175" y="163" width="550" height=".8" fill="url(#lg)"/>
  <text x="450" y="190" font-family="'Courier New',Courier,monospace" font-size="12" fill="#8B5CF6" text-anchor="middle" letter-spacing="2">Full Stack Developer  x  AI Builder  x  Founder of OneFlow</text>
  <text x="450" y="215" font-family="'Courier New',Courier,monospace" font-size="9" fill="#FF2D95" text-anchor="middle" letter-spacing="5" opacity=".8">v2.0.0  --  INDIA  --  BUILDING THE FUTURE</text>
  <rect class="cu" x="450" y="221" width="8" height="1.5" fill="#00E5FF"/>
</svg>
