<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <style>
      @keyframes logoPulse{0%,100%{opacity:.8}50%{opacity:1}}
      .logo{animation:logoPulse 3s ease-in-out infinite}
    </style>
    <filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="g2"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="topL" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#050816"/><stop offset="20%" stop-color="#00E5FF"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="80%" stop-color="#FF2D95"/><stop offset="100%" stop-color="#050816"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0L0 0 0 30" fill="none" stroke="#00E5FF" stroke-width=".2" opacity=".1"/></pattern>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#050816"/><stop offset="100%" stop-color="#030610"/></linearGradient>
    <mask id="gm"><linearGradient id="mgr" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="white" stop-opacity=".8"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient><rect width="900" height="160" fill="url(#mgr)"/></mask>
  </defs>
  <rect width="900" height="160" fill="url(#bgG)"/>
  <rect width="900" height="160" fill="url(#grid)" mask="url(#gm)"/>
  <rect x="0" y="0" width="900" height="1.5" fill="url(#topL)"/>
  <path d="M20 15L20 42M20 15L47 15" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity=".7"/>
  <path d="M880 15L880 42M880 15L853 15" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity=".7"/>
  <text class="logo" x="450" y="68" font-family="'Courier New',Courier,monospace" font-size="30" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="6" filter="url(#g)">ONEFLOW  OS</text>
  <text x="450" y="94" font-family="'Courier New',Courier,monospace" font-size="11" fill="#8B5CF6" text-anchor="middle" letter-spacing="3" opacity=".8">Building Software  x  Building AI  x  Building the Future</text>
  <rect x="280" y="110" width="340" height=".6" fill="url(#topL)" opacity=".5"/>
  <text x="450" y="128" font-family="'Courier New',Courier,monospace" font-size="9" fill="#FF2D95" text-anchor="middle" letter-spacing="2" opacity=".6">Prathamesh Sonar  x  Prathamesh-Crypto-Coder  x  India  x  2026</text>
  <circle cx="390" cy="148" r="3" fill="#00E5FF" opacity=".6" filter="url(#g2)"/>
  <text x="400" y="152" font-family="'Courier New',Courier,monospace" font-size="8" fill="#00E5FF" opacity=".6" letter-spacing="2">SYSTEM ONLINE</text>
</svg>
