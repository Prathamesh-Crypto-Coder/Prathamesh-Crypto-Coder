      @keyframes cp{0%,100%{opacity:.7;stroke-width:2}50%{opacity:1;stroke-width:3.5}}
      @keyframes ng{0%,100%{opacity:.8}50%{opacity:1}}
      .cp{animation:cp 2s ease-in-out infinite}
      .ng{animation:ng 2s ease-in-out infinite}
    </style>
    <filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
